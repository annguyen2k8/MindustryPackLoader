name: CI Matrix (v160 & v160.7)

on: [push, pull_request]

jobs:
  buildMatrix:
    name: Build & Test (Mindustry ${{ matrix.mindustryVersion }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mindustryVersion: ['v160', 'v160.7']

    steps:
    - uses: actions/checkout@v4
    - name: Set up PATH
      run: |
        echo "${ANDROID_HOME}/build-tools/34.0.0" >> $GITHUB_PATH
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew
    - name: Run Test Suite (Mindustry ${{ matrix.mindustryVersion }})
      run: ./gradlew test -PmindustryVersion=${{ matrix.mindustryVersion }}
    - name: Build Desktop JAR & Verify (Mindustry ${{ matrix.mindustryVersion }})
      run: ./gradlew jar check verifyJar -PmindustryVersion=${{ matrix.mindustryVersion }}
    - name: Build Universal Android/Desktop JAR (Mindustry ${{ matrix.mindustryVersion }})
      run: ./gradlew deploy -PmindustryVersion=${{ matrix.mindustryVersion }}
    - name: Upload Built JARs
      uses: actions/upload-artifact@v4
      with:
        name: MindustryPackLoader-${{ matrix.mindustryVersion }}
        path: |
          build/libs/MindustryPackLoader.jar
          build/libs/MindustryPackLoaderDesktop.jar
